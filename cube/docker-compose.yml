services:
  cube:
    image: cubejs/cube:latest
    ports:
      - "4000:4000"

    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: host.docker.internal
      CUBEJS_DB_PORT: 5432
      CUBEJS_DB_NAME: metricmind
      CUBEJS_DB_USER: postgres
      CUBEJS_DB_PASS: Boobesh09@@
      CUBEJS_DEV_MODE: "true"

    volumes:
      - ./schema:/cube/schema